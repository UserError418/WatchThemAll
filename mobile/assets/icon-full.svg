<?xml version="1.0" encoding="UTF-8"?>
<!--
  The composed icon, for launchers older than adaptive icons and for the splash.

  Same mark as `icon-foreground.svg` over the app's own background, scaled up:
  where the adaptive foreground has to leave room for a launcher's mask, this
  one owns its whole square, so the mark is drawn larger.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4c86a" />
      <stop offset="1" stop-color="#d99a30" />
    </linearGradient>
    <radialGradient id="bg" cx="0.5" cy="0.38" r="0.75">
      <stop offset="0" stop-color="#1b1630" />
      <stop offset="1" stop-color="#0a0a0f" />
    </radialGradient>
  </defs>

  <rect width="512" height="512" fill="url(#bg)" />

  <circle cx="256" cy="256" r="168" fill="none" stroke="url(#amber)" stroke-width="20" opacity="0.38" />
  <circle cx="256" cy="256" r="126" fill="none" stroke="url(#amber)" stroke-width="10" opacity="0.22" />

  <path
    d="M 220 190 L 326 251.5 A 9 9 0 0 1 326 260.5 L 220 322 A 9 9 0 0 1 208 314 L 208 198 A 9 9 0 0 1 220 190 Z"
    fill="url(#amber)"
  />
</svg>
