apply plugin: 'com.android.application'

/**
 * Read the version out of the repository's package.json.
 *
 * `JsonSlurper` rather than a shelled-out `node`: Gradle configuration has to
 * work in a checkout that has never run `npm install`, and this file is four
 * directories below the root only because `capacitor.config.ts` puts the
 * generated project under `mobile/`.
 */
def wtaPackageJson = new groovy.json.JsonSlurper().parse(file("$rootDir/../../package.json"))
def wtaVersionName = wtaPackageJson.version
// A pre-release (2.0.13-alpha.1) counts as its release, so the release installs over it.
def wtaVersionCode = wtaVersionName.replaceAll(/-.*$/, '').tokenize('.').withIndex().sum { part, index ->
    part.toInteger() * (100 ** (2 - index))
} as int

android {
    namespace = "net.watchthemall.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "net.watchthemall.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        /**
         * Both read from package.json, which is the one place this project
         * writes a version down.
         *
         * They used to be Capacitor's template defaults, so every APK ever
         * built here — including the one attached to the 1.5.1 release —
         * reported itself as version 1.0 in Settings, in the installer's
         * upgrade prompt, and to anything else that asks the package manager.
         * The release page and the app disagreed, and the app was wrong.
         *
         * `versionCode` is the numeric ordering Android upgrades on and it
         * must never go backwards, so the parts are packed rather than
         * counted: 1.5.1 becomes 10501. Two digits per part caps a part at 99,
         * which is a limit this project will not reach before it changes
         * shape entirely.
         */
        versionName wtaVersionName
        versionCode wtaVersionCode
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            /*
             * The APK attached to a release (`npm run apk:release`). Not
             * debuggable, unlike the debug build `npm run apk` makes for
             * development: on a debuggable app anyone with USB debugging can
             * `adb shell run-as` into its private storage, the library and the
             * sync sign-in included, with no root.
             *
             * Signed with the debug key all the same, the key every APK
             * released so far carries, so installed copies upgrade in place. A
             * new key would make Android refuse the upgrade, and uninstalling
             * first deletes the library on the phone. The key is the building
             * machine's (`~/.android/debug.keystore`), so losing it means that
             * same uninstall: it is worth a backup.
             */
            signingConfig signingConfigs.debug
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    /*
     * The JVM tests (`src/test`) run the app's own classes against the SDK's
     * stub `android.jar`, whose every method throws. `CastProxyServer` logs
     * through `android.util.Log`, and a log line is not what is under test, so
     * the stubs answer with defaults instead.
     */
    testOptions {
        unitTests.returnDefaultValues = true
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    /*
     * Google Cast. Pulls androidx.mediarouter transitively, which is what
     * `CastPlugin` uses for discovery and route selection.
     */
    implementation "com.google.android.gms:play-services-cast-framework:$castFrameworkVersion"
    /*
     * `ProbeSession` installs a script into every frame of a probe WebView
     * (`addDocumentStartJavaScript`) and mutes it (`setAudioMuted`). Capacitor
     * already ships this library, but as its own `implementation` dependency,
     * so it is not on this module's compile classpath; the version is the one
     * Capacitor's `variables.gradle` pins, so there is still only one copy.
     */
    implementation "androidx.webkit:webkit:$androidxWebkitVersion"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
