<?xml version="1.0" encoding="UTF-8"?>
<!--
  The desktop icon. Source of truth for every PNG and the .ico beside it —
  regenerate with `scripts/generate-desktop-icons.sh` after editing this.

  Same mark as `mobile/assets/icon-full.svg` and as the one the app draws in its
  own nav bar, deliberately: the icon in a dock, the icon in a launcher and the
  glyph next to the wordmark should be one thing. They were not — the PNGs
  shipped a blue triangle on navy, left over from before the interface was
  redesigned around amber, so the app a user clicked looked nothing like the
  icon they clicked it with.

  Amber is not decoration here. It is the colour of projected light and film
  leader, and it was chosen because poster art is overwhelmingly warm: a cool
  accent sits *against* the artwork, a warm one sits with it. See the palette
  note in `src/renderer/src/styles/tokens.css`.

  The one difference from the Android art is the silhouette. This is clipped to
  a rounded square rather than filling its canvas, because Linux and Windows
  draw the icon exactly as given — nothing masks it for us — while Android's
  launcher applies its own mask and would crop a shape that came pre-rounded.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4c86a" />
      <stop offset="1" stop-color="#d99a30" />
    </linearGradient>

    <!-- The app's deepest background, lifted towards the accent at the top so
         the plate reads as a deliberate surface rather than a hole punched in
         the desktop. (A CSS custom property cannot be named in an XML comment:
         its two leading hyphens end the comment early.) -->
    <radialGradient id="plate" cx="0.5" cy="0.38" r="0.75">
      <stop offset="0" stop-color="#1b1630" />
      <stop offset="1" stop-color="#0a0a0f" />
    </radialGradient>

    <clipPath id="squircle">
      <rect x="0" y="0" width="512" height="512" rx="114" ry="114" />
    </clipPath>
  </defs>

  <g clip-path="url(#squircle)">
    <rect width="512" height="512" fill="url(#plate)" />

    <!-- Two rings, well under full opacity. At 16px they disappear into the
         plate instead of turning the icon into mush, which is the failure mode
         of every detail added to an icon that also has to render tiny. -->
    <circle cx="256" cy="256" r="168" fill="none" stroke="url(#amber)" stroke-width="20" opacity="0.38" />
    <circle cx="256" cy="256" r="126" fill="none" stroke="url(#amber)" stroke-width="10" opacity="0.22" />

    <!-- The play mark, with rounded corners drawn rather than stroked so it
         stays crisp at every size. -->
    <path
      d="M 220 190 L 326 251.5 A 9 9 0 0 1 326 260.5 L 220 322 A 9 9 0 0 1 208 314 L 208 198 A 9 9 0 0 1 220 190 Z"
      fill="url(#amber)"
    />
  </g>
</svg>
